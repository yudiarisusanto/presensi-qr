    <script>
        // Tambahkan fungsi khusus dashboard siswa

            const user = currentUser;
            const contentArea = document.getElementById('content-area');
            
            // Ambil statistik kehadiran siswa
            let stats = { hadir: 0, terlambat: 0, sakit: 0, izin: 0, alpa: 0, total: 0 };

                const sb = getSupabase();

                    .eq('siswa_id', user.siswa_id);

                    data.forEach(a => {

                            stats[a.status.toLowerCase()]++;
                        }
                    });
                }

                                <p class="text-sm opacity-80 mb-4">NISN: ${user.nisn}</p>
                                <div class="flex justify-center gap-4 text-sm">

                                        <p class="font-bold text-lg">${user.kelas}</p>
                                        <p class="opacity-70 text-xs uppercase tracking-wide">Kelas</p>
                                    </div>
                                    <div class="w-px bg-white/30"></div>
                                    <div class="text-center">
                                        <p class="font-bold text-lg">${user.jurusan}</p>

                                    </div>

                                <p class="text-sm text-on-surface-variant mt-1">hari</p>
                            </div>

                                <div class="flex items-center justify-between mb-3">
                                    <p class="font-label-md text-on-surface-variant uppercase tracking-wide">Alpa</p>

                                    <div class="w-10 h-10 rounded-lg bg-primary/10 flex items-center justify-center">
                                        <span class="material-symbols-outlined text-primary">percent</span>
                                    </div>
                                </div>
                                <p class="text-4xl font-bold text-primary tracking-tighter">${persentase}%</p>
                                <p class="text-sm text-on-surface-variant mt-1">kehadiran</p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Quick Actions -->

                                    </div>
                                </button>
                                
                                <button onclick="loadPage('pengaturanSiswa')" class="w-full p-4 bg-surface-container-lowest border border-outline-variant text-on-surface rounded-xl font-label-md hover:bg-surface-container-highest transition-all flex items-center gap-4 text-left">
                                    <div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center shrink-0">
                                        <span class="material-symbols-outlined text-2xl text-on-surface-variant">manage_accounts</span>
                                    </div>
                                    <div>

                                    <span class="text-xs font-semibold">Terlambat<br>${stats.terlambat}</span>
                                </div>
                                <div class="flex flex-col items-center gap-2">
                                    <div class="w-12 bg-blue-500 rounded-t-lg transition-all" style="height: ${stats.sakit * 10}px; min-height: 20px;"></div>
                                    <span class="text-xs font-semibold">Sakit<br>${stats.sakit}</span>
                                </div>
                                <div class="flex flex-col items-center gap-2">
                                    <div class="w-12 bg-error rounded-t-lg transition-all" style="height: ${stats.alpa * 10}px; min-height: 20px;"></div>
                                    <span class="text-xs font-semibold">Alpa<br>${stats.alpa}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Riwayat Kehadiran Terbaru -->
                    <div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30 overflow-hidden">
                        <div class="p-4 border-b border-outline-variant bg-surface-bright">
                            <h2 class="font-headline-sm text-headline-sm text-on-surface flex items-center gap-2">
                                <span class="material-symbols-outlined text-primary">history</span>Riwayat Kehadiran Terbaru
                            </h2>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-surface-container-low border-b border-outline-variant">
                                        <th class="p-4 font-label-md text-on-surface-variant uppercase tracking-wider">Tanggal</th>
                                        <th class="p-4 font-label-md text-on-surface-variant uppercase tracking-wider">Waktu</th>
                                        <th class="p-4 font-label-md text-on-surface-variant uppercase tracking-wider">Mata Pelajaran</th>
                                        <th class="p-4 font-label-md text-on-surface-variant uppercase tracking-wider">Status</th>
                                    </tr>
                                </thead>
                                <tbody id="siswaAttendanceLog" class="font-body-md text-on-surface">
                                    <tr><td colspan="4" class="p-8 text-center text-on-surface-variant">Memuat riwayat...</td></tr>

            // Load riwayat kehadiran
            loadSiswaAttendanceLog();
        }
        
        async function loadSiswaAttendanceLog() {
            try {
                const sb = getSupabase();
                const { data } = await sb.from('absensi')
                    .select('*')
                    .eq('siswa_id', currentUser.siswa_id)
                    .order('created_at', { ascending: false })
                    .limit(10);
                
                const tbody = document.getElementById('siswaAttendanceLog');
                
                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-on-surface-variant">Belum ada riwayat kehadiran</td></tr>';
                    return;
                }
                
                const warnaStatus = {
                    'Hadir': 'bg-green-100 text-green-700',
                    'Terlambat': 'bg-amber-100 text-amber-700',
                    'Sakit': 'bg-blue-100 text-blue-700',
                    'Izin': 'bg-purple-100 text-purple-700',
                    'Alpa': 'bg-red-100 text-red-700'
                };
                
                tbody.innerHTML = data.map(a => `
                    <tr class="border-b border-outline-variant/50 hover:bg-surface-container-low">
                        <td class="p-4">${formatTanggalIndo(a.tanggal)}</td>
                        <td class="p-4">${a.waktu?.slice(0, 5) || '-'}</td>
                        <td class="p-4">${a.mata_pelajaran || '-'}</td>
                        <td class="p-4"><span class="px-2 py-0.5 rounded-full text-xs font-semibold ${warnaStatus[a.status] || 'bg-gray-100'}">${a.status}</span></td>
                    </tr>
                `).join('');
                
            } catch (e) {
                console.error(e);
            }
        }
        
        function loadQRScannerSiswa() {
            loadQRScanner(); // Reuse fungsi scanner yang sama
        }
        
        async function loadProfilSiswa() {
            const user = currentUser;
            const contentArea = document.getElementById('content-area');
            
            let stats = { hadir: 0, sakit: 0, alpa: 0 };
            try {
                const sb = getSupabase();
                const { data } = await sb.from('absensi')
                    .select('status')
                    .eq('siswa_id', user.siswa_id);
                if (data) data.forEach(a => { if(stats[a.status.toLowerCase()] !== undefined) stats[a.status.toLowerCase()]++; });
            } catch(e) {}
            
            contentArea.innerHTML = `
                <div>
                    <header class="mb-stack-lg border-b border-outline-variant pb-stack-sm">

                                        <div><label class="block text-xs font-label-md text-on-surface-variant uppercase tracking-wider mb-1">NISN</label><p class="font-mono">${user.nisn}</p></div>
                                        <div><label class="block text-xs font-label-md text-on-surface-variant uppercase tracking-wider mb-1">Kelas</label><p>${user.kelas}</p></div>

                                            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">Aktif</span>

                        </div>

        function loadPengaturanSiswa() {
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = `
                <div>
                    <header class="mb-stack-lg border-b border-outline-variant pb-stack-sm">
                        <h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Pengaturan</h1>

                    <div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30 p-container-padding max-w-2xl">
                        <h2 class="font-headline-sm text-on-surface mb-6 flex items-center gap-2">
                            <span class="material-symbols-outlined text-primary">lock</span>Keamanan Akun
                        </h2>
                        
                        <div class="p-4 bg-primary/5 rounded-lg border border-primary/20 mb-6">
                            <p class="font-label-md text-primary font-semibold">Informasi Akun</p>

                        </div>
                        
                        <form id="formAkun" onsubmit="event.preventDefault(); ubahPassword();" class="space-y-5">
                            <div><label class="block mb-2 font-label-md">Password Lama</label>
                                <input type="password" id="passwordLama" required class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-primary-container focus:border-primary"></div>
                            <div><label class="block mb-2 font-label-md">Password Baru</label>
                                <input type="password" id="passwordBaru" required minlength="6" class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-primary-container focus:border-primary">
                                <p class="text-xs text-on-surface-variant mt-1">Minimal 6 karakter</p></div>
                            <div><label class="block mb-2 font-label-md">Konfirmasi Password Baru</label>
                                <input type="password" id="passwordKonfirmasi" required minlength="6" class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-primary-container focus:border-primary"></div>
                            
                            <div class="flex justify-end gap-3 pt-4 border-t">
                                <button type="reset" class="px-5 py-2 rounded-lg text-on-surface-variant hover:bg-surface-container-highest">Batal</button>
                                <button type="submit" class="px-5 py-2 rounded-lg bg-primary text-on-primary hover:opacity-90 shadow-sm">Ubah Password</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }
        
        function downloadKartuSaya() {
            const user = currentUser;
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(user.nisn)}`;
            
            const cardHtml = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Kartu Absen - ${user.nama}</title>
                    <style>
                        body { margin: 0; padding: 20px; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f0f0f0; }
                        .card { width: 300px; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); overflow: hidden; }
                        .card-header { background: #004349; color: white; padding: 16px; text-align: center; }
                        .card-header h2 { margin: 0; font-size: 14px; }
                        .card-header p { margin: 4px 0 0; font-size: 10px; opacity: 0.8; }
                        .card-body { padding: 20px; text-align: center; }
                        .card-body img { width: 200px; height: 200px; border: 4px solid #f0f0f0; border-radius: 8px; }
                        .card-body h3 { margin: 12px 0 4px; font-size: 16px; color: #191c1d; }
                        .card-body p { margin: 2px 0; font-size: 12px; color: #666; }
                        .card-footer { background: #f8fafa; padding: 12px; text-align: center; font-size: 10px; color: #999; }
                        .btn { display: inline-block; margin-top: 16px; padding: 10px 24px; background: #004349; color: white; text-decoration: none; border-radius: 8px; font-size: 14px; }
                    </style>
                </head>
                <body>
                    <div>
                        <div class="card">
                            <div class="card-header">
                                <h2>KARTU ABSENSI DIGITAL</h2>
                                <p>Scan untuk Presensi</p>
                            </div>
                            <div class="card-body">
                                <img src="${qrUrl}" alt="QR Code">
                                <h3>${user.nama}</h3>
                                <p>NISN: ${user.nisn}</p>
                                <p>${user.kelas} ${user.jurusan}</p>
                            </div>
                            <div class="card-footer">PresensiQR © 2024</div>
                        </div>
                        <div style="text-align: center;">
                            <a href="${qrUrl}" download="Kartu_Absen_${user.nisn}.png" class="btn">Download QR Code</a>
                        </div>
                    </div>
                </body>
                </html>
            `;
            
            const w = window.open('', '_blank');
            w.document.write(cardHtml);
            w.document.close();
        }
        
        // Override loadPage untuk dashboard siswa
        const originalLoadPage = loadPage;
        loadPage = function(pageName) {
            currentPage = pageName;
            
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.page === pageName) item.classList.add('active');
            });
            
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = '<div class="text-center py-16"><div class="loading-spinner mx-auto mb-4"></div><p class="text-on-surface-variant">Memuat...</p></div>';
            
            switch(pageName) {
                case 'dashboardSiswa': loadDashboardSiswa(); break;
                case 'qrScannerSiswa': loadQRScannerSiswa(); break;
                case 'profilSiswa': loadProfilSiswa(); break;
                case 'pengaturanSiswa': loadPengaturanSiswa(); break;
                default: loadDashboardSiswa();
            }
        };
        
        // Inisialisasi
        initSupabase();
        checkSession('siswa');
    </script>
</body>
</html>
